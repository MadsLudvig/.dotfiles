# -- Monitors & input defaults (overridable per-host) --
monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# -- Appearance: nothing fancy --
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgb(ffffff)
    col.inactive_border = rgb(3c4048)
    layout = dwindle
}

decoration {
    rounding = 0
    blur { enabled = false }
    shadow { enabled = false }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# -- Environment --
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = XDG_SCREENSHOTS_DIR,$HOME/Pictures/Screenshots

# -- Autostart --
exec-once = swaybg -c '#16181a'
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# -- Split config files --
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/host.conf
