# Rename this file to match `hostname` on the MacBook.
# Critical: without AQ_DRM_DEVICES Hyprland will fail to start on Asahi.
# Verify device numbering with `ls /dev/dri/` — swap card0/card1 if needed.
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

monitor = eDP-1, preferred, 0x0, 2
monitor = , preferred, auto, 1

input {
    kb_layout = us
    kb_model = applealu_ansi
    kb_options = ctrl:nocaps,lv3:ralt_switch
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    vfr = true
}
